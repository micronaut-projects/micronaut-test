plugins {
    id "io.micronaut.build.internal.micronaut-test-module"
    id 'io.micronaut.graalvm' // Required to configure Graal for nativeTest
    id("io.micronaut.build.internal.kotlin-ksp")
}

tasks.withType(Test).configureEach {
    jvmArgs '-Duser.country=US'
    jvmArgs '-Duser.language=en'

    reports.html.required = !System.getenv("GITHUB_ACTION")
    reports.junitXml.required = true

    useJUnitPlatform {
        // Fixtures under io.micronaut.test.junit5.parallel and io.micronaut.test.junit5.lifecycle
        // are executed only by the tests alongside them, through their own JUnit Platform launcher.
        excludeTags("parallel-fixture")
        excludeTags("lifecycle-fixture")
    }
}

configurations {
    nativeImageTestClasspath {
        exclude(group: 'org.apache.groovy')
        exclude(group: 'org.spockframework')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.add('-parameters')
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes('Automatic-Module-Name': "${project.group}.${project.name}".replaceAll('[^\\w\\.\\$_]', "_"))
        attributes('Implementation-Version': project.findProperty("projectVersion"))
        attributes('Implementation-Title': project.findProperty("title"))
    }
}

dependencies {
    compileOnly(mn.graalvm.nativeimage)
    testImplementation(mn.graalvm.nativeimage)
    api(projects.micronautTestCore)
    api(mn.micronaut.inject)
    api(libs.managed.junit.jupiter.api)
    implementation(mn.micronaut.context)
    kspTest(mn.micronaut.inject.kotlin)
    testAnnotationProcessor(mn.micronaut.inject.java)
    testAnnotationProcessor(mn.micronaut.graal)
    testImplementation(libs.managed.junit.jupiter.params)
    testImplementation(libs.managed.junit.platform.testkit)
    testImplementation(mn.kotlin.stdlib)
    testImplementation(mn.micronaut.http.server.netty)
    testImplementation(mn.micronaut.http.client)
    testImplementation(libs.managed.mockito.junit.jupiter)
    testImplementation(libs.managed.hamcrest)
    testImplementation(mnData.micronaut.data.tx)
    testImplementation(mnData.micronaut.data.hibernate.jpa)
    testRuntimeOnly(mn.snakeyaml)
    testRuntimeOnly(mnLogging.logback.classic)
    testRuntimeOnly(mnSql.micronaut.jdbc.tomcat)
    testRuntimeOnly(mnSql.h2)
    testRuntimeOnly(mnSerde.micronaut.serde.jackson)
    testRuntimeOnly(libs.managed.junit.jupiter.engine)
    testRuntimeOnly(libs.managed.junit.platform.launcher)
    testRuntimeOnly(testFixtures(projects.micronautTestCore))
}

graalvmNative {
    metadataRepository {
        enabled = true
    }
    binaries {
        test {
            buildArgs.add('--initialize-at-run-time=io.micronaut.test.junit5.server.ExternalServerTest')
            resources.autodetect()
        }
    }
}

tasks.named("test") {
    systemProperty("mockito.test.enabled", "true")
    // Runs this module's own suite under JUnit parallel execution, to check the resource lock
    // against real tests rather than only against the fixtures. For example:
    //   ./gradlew :micronaut-test-junit5:test -PparallelMode=concurrent -PparallelClassesMode=concurrent
    if (project.hasProperty("parallelMode")) {
        systemProperty("junit.jupiter.execution.parallel.enabled", "true")
        systemProperty("junit.jupiter.execution.parallel.mode.default", project.property("parallelMode"))
        systemProperty("junit.jupiter.execution.parallel.mode.classes.default", project.hasProperty("parallelClassesMode") ? project.property("parallelClassesMode") : "same_thread")
    }
}
