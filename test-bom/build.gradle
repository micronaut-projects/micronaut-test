plugins {
    id "io.micronaut.build.internal.bom"
}

repositories {
    gradlePluginPortal() // needed for checkBom task to resolve plugin dependencies defined in kotest-pom
}

micronautBom {
    suppressions {
        acceptedLibraryRegressions.add("micronaut-test-kotest")
        acceptedLibraryRegressions.add("junit-platform-runner")
        acceptedLibraryRegressions.add("junit-platform-jfr")
        acceptedVersionRegressions.add("junit-platform")

        // Kotest 6.2.5 declares these artifacts, but they are not published to Maven Central.
        dependencies.add("io.kotest:kotest-assertions-jsoup:6.2.5")
        dependencies.add("io.kotest:kotest-assertions-jsoup-jvm:6.2.5")
    }
}
