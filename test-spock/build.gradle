plugins {
    id "io.micronaut.build.internal.micronaut-test-module"
}

dependencies {

    compileOnly(libs.jakarta.inject.api)

    api(platform(libs.boms.spock))
    api(projects.micronautTestCore)
    api(mn.micronaut.inject)
    api(libs.spock.core) {
        exclude group: "org.codehaus.groovy", module: "groovy-all"
    }

    implementation(mn.micronaut.context)

    testCompileOnly(libs.jakarta.inject.api)

    testImplementation(mn.micronaut.inject.groovy)
    testImplementation(mn.micronaut.http.server.netty)
    testImplementation(mn.micronaut.http.client)
    testImplementation(mnSql.micronaut.jdbc.hikari)
    testImplementation(mnHibernateValidator.micronaut.hibernate.validator)
    testImplementation(mnSpring.micronaut.spring)
    testImplementation(mnReactor.micronaut.reactor)

    testRuntimeOnly(mn.snakeyaml)
    testRuntimeOnly(mnLogging.logback.classic)
    testRuntimeOnly(mnSerde.micronaut.serde.jackson)
    testRuntimeOnly(mnSql.h2)
    testRuntimeOnly(testFixtures(projects.micronautTestCore))
}

configurations.named("testRuntimeClasspath") {
    // the build plugin adds this module to its own test classpath as a jar, next to the main output.
    // Spock then loads the global extension service file twice and refuses to start.
    exclude(group: "io.micronaut.test", module: "micronaut-test-spock")
}
